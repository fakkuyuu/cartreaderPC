name: Package Windows Portable release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-release-PC133
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: v15.5-PC133
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PC build dependencies
        run: python -m pip install -r pc/requirements.txt pyinstaller==6.16.0
      - name: Run PC tests
        run: python -m unittest discover -s pc -p 'test_*.py'
      - name: Build and verify portable ZIP
        run: ./.github/scripts/package-portable.ps1
      - name: Attach ZIP to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "$env:RUNNER_TEMP/cartreaderPC-PC133-Portable.zip"
          $notes = "$env:RUNNER_TEMP/portable-release-notes.md"
          $release = gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json |
            Where-Object tagName -eq $env:RELEASE_TAG
          if (!$release) {
            gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "cartreaderPC PC133" --notes-file $notes $zip "$zip.sha256"
          } elseif ($release.isDraft) {
            gh release upload $env:RELEASE_TAG $zip "$zip.sha256" --clobber
            gh release edit $env:RELEASE_TAG --target $env:GITHUB_SHA --notes-file $notes
          } else {
            throw "Refusing to replace assets of a published release."
          }
