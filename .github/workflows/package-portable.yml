name: Package Windows Portable release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-release-PC115
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: v15.5-PC115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PC build dependencies
        run: python -m pip install -r pc/requirements.txt pyinstaller==6.16.0
      - name: Run PC tests
        run: python -m unittest discover -s pc -p 'test_*.py'
      - name: Build and verify portable ZIP
        run: ./.github/scripts/package-portable.ps1
      - name: Attach ZIP to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "cartreaderPC PC115" --notes-file "$env:RUNNER_TEMP/portable-release-notes.md" "$env:RUNNER_TEMP/cartreaderPC-PC115-Portable.zip" "$env:RUNNER_TEMP/cartreaderPC-PC115-Portable.zip.sha256"
