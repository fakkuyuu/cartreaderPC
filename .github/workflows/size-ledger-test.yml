name: Size candidate ledger tests

on:
  push:
    branches: [experiment/size-ledger-implementation]
    paths:
      - '.github/scripts/size-candidate-ledger.py'
      - '.github/scripts/test-size-candidate-ledger.py'
      - '.github/workflows/size-ledger-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile Python scripts
        run: python -m py_compile .github/scripts/size-candidate-ledger.py .github/scripts/test-size-candidate-ledger.py
      - name: Test cross-chat duplicate and retest policy
        run: python .github/scripts/test-size-candidate-ledger.py
